<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0e">
<title>Offline · Onyx</title>
<style>
  html,body{height:100%;margin:0;background:#0b0b0e;color:#f4f4f6;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em}
  p{margin:0;color:#a1a1aa;max-width:320px}
  button{margin-top:8px;min-height:44px;padding:0 24px;border:0;border-radius:999px;background:#f4f4f6;color:#0b0b0e;font:inherit;font-weight:600;cursor:pointer}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>No Connection</h1>
  <p>Onyx needs a network connection to load. Check the connection and try again.</p>
  <button type="button" onclick="location.reload()">Retry</button>
</main>
</body>
</html>
